# Overlay de PRODUÇÃO: api, worker e front na VPS, sem proxy próprio (mesmo arranjo do
# property-scout e do coda).
#
# Quem termina o HTTPS é o Caddy compartilhado da VPS (`~/caddy`, repo vps-infra), que lê um
# Caddyfile estático e alcança os containers pela rede externa `edge`. Entrar no ar exige um bloco
# no Caddyfile da VPS: ver `docs-tec/deploy.md`.
#
# Na VPS (é o que o forced command `~/bin/deploy.sh` roda):
#   IMAGE_TAG=<sha> docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  postgres:
    # NADA de banco exposto. `!override` e não lista vazia: o Compose CONCATENA `ports` entre
    # arquivos, e sem a tag o `5432:5432` de dev sobreviveria em 0.0.0.0 (o Docker escreve iptables
    # direto, o ufw não vê).
    ports: !override []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}

  migrate:
    networks:
      - default

  api:
    container_name: gas-api
    ports: !override []
    environment:
      APP_URL: ${APP_URL:-https://gas.imp-software.cloud}
      # HTTPS termina no Caddy: o cookie de sessão precisa do `Secure`, e o throttler precisa do IP
      # real do cliente, não o do proxy.
      COOKIE_SECURE: "true"
      TRUST_PROXY: "1"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - default
      - edge

  worker:
    networks:
      - default

  front:
    container_name: gas-front
    image: ghcr.io/jpmvale/gas-individualizado-front:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/front/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3001"
      # O Next standalone escuta no endereço de `HOSTNAME`, que o Docker define como o ID do
      # container. Com duas redes esse nome resolve para dois IPs e o Next liga-se a um só; quando
      # calha de ser o da rede interna, o Caddy leva `connection refused` pela `edge` (502 com o
      # container "Up"). Foi o que aconteceu no coda em 03/08/2026.
      HOSTNAME: 0.0.0.0
    expose:
      - "3001"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - default
      - edge

networks:
  # Rede do proxy compartilhado, criada fora do compose (`docker network create edge`).
  edge:
    external: true
