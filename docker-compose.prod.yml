# Overlay de PRODUÇÃO: adiciona o front (Next standalone) e o Caddy à base. VPS única:
#   SITE_ADDRESS=gas.exemplo.com docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  front:
    image: ghcr.io/jpmvale/gas-individualizado-front:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/front/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3001"
    expose:
      - "3001"
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      # Prod: domínio (HTTPS automático). Local: ":80" (HTTP puro).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - front
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
